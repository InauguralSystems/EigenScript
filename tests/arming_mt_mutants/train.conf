# mutant: structural row | behavioural lane | historical TSan witness hits
# fix-reverted: construction_unconditional | two-state release | 3/3
# occ-tier-not-widened: construction_armlocked | two-state intermittent | 3/3
# two-state-guard-removed: construction_unconditional | occ/hist/st + two-state
# reader-lock-removed: construction_armlocked (per-site) | release quiet | 3/3
# reader-lock-deadcoded: none (text still present) | release survived | 3/3
# hist-writer-unlocked: construction_armlocked (writer's own body) | TSan 3/3
# Text cannot prove execution. No TSan for two-state-guard-removed: release
# conserved-quantity assertions already kill it. History writer can livelock.
STYLE=lanes
ORACLE_TIMEOUT=600
ORACLES=('bash tests/test_arming_mt.sh')
COMPLETED=('^ARMING_MT: [1-9][0-9]* passed')
MUTANTS=(fix-reverted occ-tier-not-widened two-state-guard-removed reader-lock-removed reader-lock-deadcoded hist-writer-unlocked)
# mutant | printed stem | fixture | seconds (all witnesses run three times)
WITNESSES=(
"fix-reverted two-state tests/test_arming_two_states.c ${MUTANT_TSAN_TIMEOUT:-600}"
"occ-tier-not-widened two-state tests/test_arming_two_states.c ${MUTANT_TSAN_TIMEOUT:-600}"
"reader-lock-removed two-state tests/test_arming_two_states.c ${MUTANT_TSAN_TIMEOUT:-600}"
"reader-lock-deadcoded two-state tests/test_arming_two_states.c ${MUTANT_TSAN_TIMEOUT:-600}"
"hist-writer-unlocked two-state tests/test_arming_two_states.c ${MUTANT_TSAN_TIMEOUT_LIVELOCK:-60}"
)
