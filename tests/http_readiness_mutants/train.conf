# Live HTTP oracle, one run, first named failing check; no TSan lane.
# Every behavioural mutant targets ext_http.c (patch or sed); controls are separate.
BUILD=http
BUILD_GOAL=http
RUNS=1
STYLE=single
FAIL_MODE=first
DEFAULT_TARGET=src/ext_http.c
ORACLE_TIMEOUT=120
ORACLES=('python3 tests/http_readiness.py')
COMPLETED=('^HTTP_READINESS: [1-9][0-9]* passed')
MUTANTS=(
init-200-for-everything liveness-any-path header-omitted-on-static
header-omitted-on-options header-omitted-on-global-cap header-omitted-on-per-ip-cap
header-omitted-in-init-window serial-init-responder client-deadline-off
capacity-shed-off teardown-drain-off handoff-drain-off validation-accepts-crlf
owned-name-accepted name-check-colon-only header-omitted-on-403 capacity-doubled
empty-value-rejected serial-handling shed-body-on-head sigpipe-default-in-init
name-check-allows-delims rejected-flag-ignored-by-early-bind runtime-emitted-name-accepted
serving-shed-body shed-write-blocking init-reply-write-blocking
)
