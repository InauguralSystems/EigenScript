# mutant: structural row | behavioural lane (historical measurements)
# fix-reverted: construction_rehome | release 0/10, ASan 5/5 loadfile + same_import
# loading-stack-shared-again: construction_loadstack | loader_mt_loadfile 10/10
# lost-put-pushes-private: construction_lostput | loader_mt_same_import
# lock-removed: construction_modcache | lm_same_import TSan 0/3 STRUCTURAL-ONLY
# ns-rebuild-unlocked: construction_nswrite | lm_nsread TSan 0/3 STRUCTURAL-ONLY
# mt-flag-ignored: construction_nsmt | none in one state; harm needs two states
# ns-retire-frees-immediately: none | lm_nsread TSan 3/3, release 0/10
# put-lostrace-no-unlock: construction_modcache per-exit unlocks | import/same_import HUNG
# Mutex loss duplicates/loses entries in a narrow scheduler window; construction
# rows are per-site exact counts. No TSan for deadlock: the clock is its witness.
STYLE=lanes
ORACLE_TIMEOUT=900
ORACLES=('bash tests/test_loader_mt.sh')
COMPLETED=('^LOADER_MT: [1-9][0-9]* passed')
MUTANTS=(fix-reverted loading-stack-shared-again lock-removed ns-rebuild-unlocked mt-flag-ignored lost-put-pushes-private ns-retire-frees-immediately put-lostrace-no-unlock)
WITNESSES=(
"lock-removed lm_same_import tests/loader_mt_modules/lm_same_import.eigs ${MUTANT_TSAN_TIMEOUT:-600}"
"ns-rebuild-unlocked lm_nsread tests/loader_mt_modules/lm_nsread.eigs ${MUTANT_TSAN_TIMEOUT:-600}"
"ns-retire-frees-immediately lm_nsread tests/loader_mt_modules/lm_nsread.eigs ${MUTANT_TSAN_TIMEOUT:-600}"
)
