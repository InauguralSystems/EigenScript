# mutant: structural row | behavioural lane
# claim-step-removed, lock-released-before-join: construction_claim | double_join HUNG
# generation-ignored: none | handles_reuse (call-site grep cannot prove comparison)
# full-table-returns-null: none | handles_full (error text is dead-coded)
# modenv-predicate-reverted: construction_modenv | handles_modenv SIGSEGV
# mirror-lock-removed: construction_mirror | tsan:hm_modenv (hits: see each run)
# store-get-null-on-stale: construction_storeraise | handles_store_stale
# channel-gen-ignored: none | handles_channel_stale (survived before this row)
# Claim mutants' runtime witness is the clock; mirror corruption is intermittent.
STYLE=lanes
ORACLE_TIMEOUT=900
ORACLE_ENV=("EIGS_MT_ROW_TIMEOUT=${MUTANT_ROW_TIMEOUT:-20}")
ORACLES=('bash tests/test_handles_mt.sh')
COMPLETED=('^HANDLES_MT: [1-9][0-9]* passed')
MUTANTS=(claim-step-removed lock-released-before-join generation-ignored full-table-returns-null modenv-predicate-reverted mirror-lock-removed store-get-null-on-stale channel-gen-ignored)
WITNESSES=("mirror-lock-removed hm_modenv tests/handles_mt_modules/hm_modenv.eigs ${MUTANT_TSAN_TIMEOUT:-600}")
