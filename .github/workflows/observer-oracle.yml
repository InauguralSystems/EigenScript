name: observer oracle (nightly)

# The observer oracle's per-verdict floor, nightly and on dispatch (#1764).
#
# Pull requests and the merge queue run the same lane as ci.yml's required
# check `observer oracle (v0.46.0 floor)` (#1778). That job and this one both
# run tools/observer_oracle/ci_lane.sh, so no pull request runs the lane twice
# and the two runs cannot drift. Every push to main runs the required check
# too; this run also covers what no commit changes: the rolling ci-main image
# and the runner.
#
# A failed run reaches only GitHub's notification to the user who last edited
# the cron line, not nightly.yml's tracking issue (#1779).

on:
  schedule:
    # 04:43 UTC: off the hour, and clear of nightly.yml's 04:17.
    - cron: '43 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observer-oracle-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  floor:
    name: nightly / observer oracle (v0.46.0 floor)
    runs-on: ubuntu-latest
    # About 2 minutes measured (84-115 s on PR #1777); this bounds a hang.
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    # The rolling dev image every main push publishes (ci.yml, dev-image): a
    # workflow other than ci.yml cannot read that job's output.
    container:
      image: ghcr.io/inauguralsystems/eigenscript-dev:ci-main
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Observer oracle lane (tools/observer_oracle/ci_lane.sh)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash tools/observer_oracle/ci_lane.sh
