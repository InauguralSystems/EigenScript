name: Release

# Two entry points:
#  - pushing a v* tag (the classic path), or
#  - workflow_dispatch, which creates the tag itself (version defaults to
#    the VERSION file) and then builds the release. The dispatch path
#    exists because tags can't always be pushed from every environment,
#    and a GITHUB_TOKEN-pushed tag would not retrigger this workflow —
#    so the dispatch run does the whole job end to end.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag and release (default: the VERSION file)"
        required: false

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Determine release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VER="$VERSION_INPUT"
            [ -z "$VER" ] && VER="$(cat VERSION)"
            if [[ ! "$VER" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::release version must match ^v?[0-9]+\.[0-9]+\.[0-9]+$"
              exit 1
            fi
            echo "tag=v${VER#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Require commit on main
        env:
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: sh tools/release_main_guard.sh

      # Every release first reviews docs and config since the previous release
      # (docs/release-reviews/README.md). No record, no tag. Read the tag from
      # env, never by inline interpolation into the script.
      - name: Require the release legibility review record
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: sh tools/release_review_guard.sh

      - name: Create tag (dispatch only, idempotent)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists on origin — releasing it as-is"
          else
            git tag -a "$TAG" -m "EigenScript $TAG"
            git push origin "$TAG"
          fi

  # One leg per released platform. Linux additionally ships the `full`
  # variant (http+net+gfx+db); macOS ships the minimal build only — the
  # arm64 binary is interpreter-only until the ARM64 JIT exists. Every
  # leg runs the entire suite against the exact binary it uploads.
  # macos-15-intel is GitHub's hosted Intel runner (the macos-13
  # replacement); macos-latest is Apple Silicon.
  build:
    name: build (${{ matrix.label }})
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build the Linux binary on the OLDEST supported LTS so its glibc
          # floor stays low and the artifact runs on older distros. GitHub
          # flipped `ubuntu-latest` 22.04 -> 24.04 (glibc 2.39), which raised
          # the floor to GLIBC_2.38 and broke the binary on Ubuntu 22.04 LTS.
          # 22.04 = glibc 2.35; the result runs on 22.04 and every newer distro.
          - os: ubuntu-22.04
            label: linux-x86_64
          - os: macos-15-intel
            label: macos-x86_64
          - os: macos-latest
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Build and test the release artifact
        uses: ./.github/actions/release-build
        with:
          label: ${{ matrix.label }}
          runner: ${{ matrix.os }}

  # The CI dry-run reuses the composite build/test recipe above, but cannot
  # exercise this attestation and release-upload job. It deliberately has no
  # contents:write permission and never creates a tag or GitHub release.
  release:
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: binaries-*
          merge-multiple: true

      # Verifiable with `sha256sum -c CHECKSUMS` (Linux) or
      # `shasum -a 256 -c CHECKSUMS` (macOS).
      - name: Generate CHECKSUMS
        run: |
          sha256sum eigenscript-* > CHECKSUMS
          cat CHECKSUMS

      # Sigstore keyless build provenance for each released binary.
      # Verifiable with `gh attestation verify eigenscript-<label> \
      #   --repo InauguralSystems/EigenScript`. The .sigstore.json bundle
      # is also uploaded to the release for offline verification.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: 'eigenscript-*'

      - name: Stage attestation bundle for release
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" attestation.sigstore.json

      - name: Upload binaries to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          files: |
            eigenscript-*
            CHECKSUMS
            attestation.sigstore.json
