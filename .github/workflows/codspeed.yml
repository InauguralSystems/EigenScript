name: CodSpeed

# The hosted twin of the CI `bench` job. That job DIFFS cachegrind Ir of the PR
# binary against an origin/main binary and is the merge gate. This lane runs
# the same class of measurement (valgrind CPU simulation, deterministic) on
# the targets in codspeed.yml and uploads per-commit results, so every PR gets
# a differential flamegraph per target and a trend line lives somewhere other
# than a checked-in baseline. It is a PROFILER and a record, not a second
# gate: nothing here is a required check.
#
# Docs-only diffs are skipped by path: they cannot change the instruction
# count of a C binary.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'

permissions:
  contents: read

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulation:
    name: codspeed (simulation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write  # OIDC upload; the repo is public, so no token secret is needed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build the release interpreter
        run: ./build.sh

      # The target set is a claim; pin it before measuring anything. Red if a
      # consumer row is gone, the pin is a branch name, or an exec line reaches
      # a DMG outside the fetched dir. Its --selftest plants each of those.
      - name: Pin the lane's target set (tools/codspeed_targets_check.sh)
        run: bash tools/codspeed_targets_check.sh

      # A real consumer in the matrix. Pinned by SHA, not branch: a moving
      # consumer would put ITS changes into this repo's trend line (the
      # solver-policy confound). Bump deliberately, in a PR that says why.
      # Shallow fetch of one commit; `git clone` of a branch is not a pin.
      - name: Fetch consumer DMG at its pin
        env:
          DMG_REF: afd9bd52778cb0a8d1ab0473ec726aaae556fb90  # DMG master, 2026-10-06 (DMG#79: ready for the boolean type, #1637)
        run: |
          set -euo pipefail
          mkdir -p .codspeed-consumers/DMG && cd .codspeed-consumers/DMG
          git init -q && git remote add origin https://github.com/InauguralSystems/DMG
          git fetch -q --depth 1 origin "$DMG_REF"
          git -c advice.detachedHead=false checkout -q FETCH_HEAD
          test -f roms/cpu_instrs.gb && test -f eigs.json
          echo "DMG at $(git rev-parse HEAD)"

      # `run` is deliberately omitted: with no command the runner executes the
      # exec-harness targets declared in codspeed.yml at the repository root.
      #
      # THE UNIT (#2002). A row's Value is MODELED CYCLES at 3.6 GHz, not
      # instructions. The runner always simulates caches; cycle-estimation OFF
      # only drops the per-instruction cycle table. What is left is exact
      # arithmetic on the runner's own callgrind profile: 1 cycle per
      # instruction fetch and per data load/store (hit or miss), plus 5 per L1
      # miss and 100 per last-level miss. A row therefore reads roughly 1.4 to
      # 1.6 times its cachegrind `Ir`, the bench job's unit (1.39 to 1.56 on the
      # rows measured, registered in docs/INSTRUMENTS.md). With
      # cycle-estimation ON the first runs read 3.0 to 3.5 times Ir, ~60% of the
      # DMG shape attributed to simulated cache misses that perf stat refuted
      # (IPC 1.61, 1.6% last-level references); #1221 turned it off for that
      # reason and described the result as instructions. It never was: the first
      # run after it already read 1.39 to 1.56 times Ir.
      #
      # `runner-version` is PINNED to the runner this action SHA defaults to
      # (.codspeed-runner-version in the action). The runner, and the valgrind
      # fork it installs, decide the unit; the action's default moves with
      # every bump dependabot makes. Move the pin deliberately, in a PR whose
      # lane run passes the unit guard below; codspeed_targets_check.sh keeps
      # the pin and the guard from being deleted.
      - name: Run codspeed.yml targets under CPU simulation
        id: codspeed
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da  # v5.5.0
        with:
          mode: simulation
          cycle-estimation: false
          runner-version: 5.5.0

      # The unit is a claim: re-derive it on THIS run (tools/codspeed_unit_guard.py).
      # It reads the observed_loop row's raw callgrind events from the profile
      # folder the runner just wrote, reads the run's Value back from CodSpeed's
      # public API (the action's run-id output) and goes red, naming the property
      # that moved, unless the Value is the registered modeled-cycles arithmetic.
      # It also goes red when it cannot verify. Skipped for fork PRs only: a
      # fork's upload carries no promise of a readable run, and the pin on main
      # moves only by a reviewed merge.
      - name: Guard the lane's unit (tools/codspeed_unit_guard.py)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CODSPEED_RUN_ID: ${{ steps.codspeed.outputs.run-id }}
        run: python3 tools/codspeed_unit_guard.py
