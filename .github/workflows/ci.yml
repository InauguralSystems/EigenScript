name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# How many shards the ASan suite runs in. The aggregator's union check and its
# receipt count read this; the MATRIX cannot (GitHub does not expand `env` in
# `strategy.matrix`), so `shard: [1, 2, 3]` and the `/3` in the job name and in
# EIGS_SUITE_SHARD are literals. That is three homes for one number, so it is
# GATED rather than hand-synced: tools/section_plan.sh --selftest reads this
# file and fails if the matrix length, the `/N` literals and ASAN_SHARDS
# disagree (mechanical-gates §26 — care does not scale past the second copy).
env:
  ASAN_SHARDS: 3

# Only one CI run per ref in flight: a new push (or PR update) cancels the
# older run for the same branch. Prevents superseded/hung runs from piling
# up (2026-08-18: three main-push runs — 214m/118m/81m — alive at once after
# a valgrind flake, none superseding the others). Pairs with the per-job
# timeout-minutes, which bounds a single hang; this bounds the *fan-out*.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# TWO LANES (#1160).
#
# Measured on PR #1158 (head 8cc1f2d, 26 checks, all green): 35 min wall,
# ~200 machine-minutes. The SAME ~240-section suite ran in TEN jobs that
# differ only in the extension surface of the binary, and section [99i] (the
# -Werror compile-line audit — dry runs of every make target plus a scan of
# ~110 scripts; 6 min on the dev box, minutes on a runner) ran inside every
# one of them, for a property that does not depend on the variant.
#
#   PR lane (pull_request)  — target <= 15 min wall. ONE full suite
#     (linux/gcc). Every variant job runs only the sections its binary
#     unlocks, DERIVED by tools/section_plan.sh from the suite's own
#     probe gates (never a hand-written list). [99i] runs ONCE, in the
#     `werror audit` job, cached on the audit's inputs. macos-15-intel is
#     not on this lane.
#   main lane (push to main) — the full matrix, exactly as before, except
#     that [99i] is owned by the one `werror audit` job instead of being
#     repeated ten times. The merge-er waits for this; contributors do not.
#   nightly (.github/workflows/nightly.yml) — macos-15-intel and the full
#     valgrind corpus, with a tracking issue on failure.
#
# The risk this accepts, stated: a variant-specific regression in a
# NON-variant section reaches main before it is caught. Main still runs the
# full matrix before anything is released.

jobs:
  # Is this PR docs-only? A change touching nothing but *.md cannot alter C or
  # .eigs behavior, so the legs below that build/run the runtime have nothing to
  # say about it — they burn ~10 min of a contributor's wall-clock proving that
  # a paragraph did not break AddressSanitizer.
  #
  # The doc gates are NOT skipped: docs/SPEC.md + COMPARISON.md examples are
  # executed byte-for-byte ([89]/[90]) and doc drift is checked ([98]) inside
  # run_all_tests.sh, which the linux legs still run in full.
  #
  # NOTE: the expensive JOBS still run — only their STEPS are guarded. "asan +
  # ubsan (full suite)" is a REQUIRED status check on the default branch, and a
  # required check that is skipped never reports, which blocks the merge
  # forever. Reporting success in seconds is the only safe shape here.
  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        name: Detect whether any non-docs file changed
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "not a PR — treating as code"
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          files=$(git diff --name-only "$base" "$head")
          echo "changed files:"; echo "$files" | sed 's/^/  /'
          # Anything not ending in .md means the runtime could be affected.
          if printf '%s\n' "$files" | grep -qvE '\.md$'; then
            echo "-> code change present: full CI"
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "-> docs-only: runtime legs report green without building"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Build the shared dev/CI image (.devcontainer/Dockerfile) and push it to
  # GHCR tagged to this commit. Every Linux leg below runs *inside* this image
  # via `container:`, so the environment Codespaces opens and the environment
  # CI tests in are byte-for-byte the same toolchain — they cannot drift.
  # gha-cached, so an unchanged Dockerfile rebuilds in seconds.
  dev-image:
    name: build dev/ci image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      # Fork PRs run with a read-only GITHUB_TOKEN (no packages:write), so
      # they cannot push a ci-<sha> image — and with no image, every Linux
      # leg used to skip, leaving fork PRs with no Linux CI at all. Fork
      # PRs instead run inside the rolling `ci-main` image that every main
      # push publishes below: same toolchain, just not rebuilt from the
      # PR's Dockerfile. (The rare fork PR that EDITS
      # .devcontainer/Dockerfile still tests with the base image — push
      # its branch to origin to exercise the Dockerfile change.)
      - name: Log in to GitHub Container Registry
        if: github.event.pull_request.head.repo.fork != true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires a lowercase owner; compute the ref once and hand it to
      # the downstream jobs through a job output. `image` is what the Linux
      # legs run in; `tags` is what this job pushes (empty on fork PRs —
      # nothing is pushed; main pushes also advance the rolling ci-main tag).
      - name: Compute image ref
        id: ref
        env:
          OWNER: ${{ github.repository_owner }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork == true }}
          EVENT: ${{ github.event_name }}
        run: |
          BASE="ghcr.io/${OWNER,,}/eigenscript-dev"
          if [ "$IS_FORK" = "true" ]; then
            echo "image=$BASE:ci-main" >> "$GITHUB_OUTPUT"
            echo "tags=" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "push" ]; then
            echo "image=$BASE:ci-${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "tags=$BASE:ci-${{ github.sha }},$BASE:ci-main" >> "$GITHUB_OUTPUT"
          else
            echo "image=$BASE:ci-${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "tags=$BASE:ci-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push dev image
        if: github.event.pull_request.head.repo.fork != true
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.ref.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # [99i], ONCE per run, cached (#1160).
  #
  # tools/werror_switch_check.sh asserts every compile invocation the Makefile
  # and the tracked scripts emit carries -Werror=switch/comment/
  # misleading-indentation. That is a property of the Makefile and the scripts:
  # it cannot differ between a zlib build and a gfx build. It was nevertheless
  # running inside all ten suite jobs (6 min on the dev box, minutes on a
  # runner, ~500 compile invocations audited each time).
  #
  # Here it runs once, and the ten suite jobs set EIGS_SKIP_WERROR_AUDIT=1 so
  # [99i] prints a SKIP naming this job rather than silently measuring less.
  # Locally (no env var) run_all_tests.sh still runs it in full.
  #
  # The cache key is tools/werror_cache_key.sh: the Makefile's content, every
  # tracked *.sh, and the NAMES of tracked files under src/ tests/ tools/ web/
  # fuzz/ (a new source file changes the compile lines even though no covered
  # file's content moved). Its --selftest carries both halves of the control:
  # a one-line Makefile edit MISSES, a docs-only edit HITS.
  werror-audit:
    name: werror audit ([99i], cached)
    needs: [dev-image, scope]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.dev-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # A docs-only PR cannot change the Makefile or any tracked script, so it
      # cannot change this audit's verdict. The job still REPORTS (a required
      # check that never reports blocks the merge forever) — it just does not
      # compute, restore or run anything.
      - name: Docs-only — the audit's inputs cannot have changed
        if: needs.scope.outputs.code != 'true'
        run: |
          echo "werror audit: docs-only change; the Makefile and every tracked *.sh are untouched, so [99i]'s verdict cannot have moved."

      - name: Compute the audit cache key
        if: needs.scope.outputs.code == 'true'
        id: key
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash tools/werror_cache_key.sh --explain
          echo "key=$(bash tools/werror_cache_key.sh)" >> "$GITHUB_OUTPUT"

      # UNCACHED, every run, before the cache is consulted (#1160 round 2).
      # The generated-header probes RUN the LSP index generators, and those
      # read C sources — gen_lsp_builtin_index.sh reads the reserved observer
      # words out of src/lexer.c. A blind critic planted `return (TOK_REPORT);`
      # there and got a FAILING audit behind an UNCHANGED cache key. This half
      # is 0.5 s measured, so it costs nothing to never cache it.
      - name: Generated LSP header probes (uncached — they read C sources)
        if: needs.scope.outputs.code == 'true'
        run: bash tools/werror_switch_check.sh --headers-only

      - name: Restore the audit result
        if: needs.scope.outputs.code == 'true'
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .werror-audit-ok
          key: werror-audit-v1-${{ steps.key.outputs.key }}

      # A cache hit must SAY it skipped, and say what it skipped over — a log
      # in which "audited 543 invocations" and "did not run" look the same is
      # the failure this whole change is trying not to introduce.
      - name: Cache HIT — the audit already passed for these exact inputs
        if: needs.scope.outputs.code == 'true' && steps.restore.outputs.cache-hit == 'true'
        run: |
          echo "werror audit: CACHE HIT on werror-audit-v1-${{ steps.key.outputs.key }}"
          echo "werror audit: [99i] NOT RUN this time; the stored result is:"
          cat .werror-audit-ok

      - name: Cache MISS — run the compile-line audit ([99i])
        if: needs.scope.outputs.code == 'true' && steps.restore.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          echo "werror audit: CACHE MISS on werror-audit-v1-${{ steps.key.outputs.key }} — running the audit"
          # The planted-fault self-test (proving the classifier is not
          # vacuously green) and the dry-run audit. `--no-headers`: the
          # generated-header probes ran UNCACHED in the step above, because
          # their verdict moves with C-source content that this cache key
          # deliberately does not hash.
          bash tools/werror_switch_check.sh --selftest
          bash tools/werror_switch_check.sh --no-headers
          {
            echo "werror audit passed"
            echo "key=${{ steps.key.outputs.key }}"
            echo "commit=$GITHUB_SHA"
            echo "run=$GITHUB_RUN_ID"
          } > .werror-audit-ok

      # Saved only on the miss path, and only after the audit exited 0: a
      # marker written unconditionally would cache a FAILURE as a pass.
      - name: Save the audit result
        if: needs.scope.outputs.code == 'true' && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .werror-audit-ok
          key: werror-audit-v1-${{ steps.key.outputs.key }}

  # The new gates in this change are gates, so they get the treatment every
  # other gate here gets: their planted-fault trains run in CI, on every run,
  # cheaply. Without this the section-plan derivation and the cache key would
  # be the only checks in the tree whose "it goes red when it should" claim
  # rests on a local run.
  gate-selftests:
    name: gate self-tests (section plan + audit cache key)
    needs: [dev-image, scope]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.dev-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - if: needs.scope.outputs.code == 'true'
        name: Build (the section plan runs the suite's own probes)
        run: ./build.sh
      - if: needs.scope.outputs.code == 'true'
        name: Audit cache-key planted-invalidation controls
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash tools/werror_cache_key.sh --selftest
      - if: needs.scope.outputs.code == 'true'
        name: Section-plan derivation controls
        run: bash tools/section_plan.sh --selftest
      - if: needs.scope.outputs.code == 'true'
        name: The derived plans, printed (the numbers a reviewer checks)
        run: |
          bash tools/section_plan.sh --gate-audit
          bash tools/section_plan.sh --skip-audit
          bash tools/section_plan.sh --probes
          bash tools/section_plan.sh --print-section-plan core

  # Linux build + full suite, inside the shared image, for gcc and clang.
  # gcc and clang shake out different warnings and codegen.
  build-and-test-linux:
    name: linux / ${{ matrix.cc }}
    needs: dev-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      # THE LANE THAT HOLDS A TOKEN. Suite section [99zd] runs
      # tools/roadmap_check.sh and tools/issue_labels_check.sh; their GitHub
      # arms — the milestone-set mirror and the reference resolver, which are
      # the whole point of #1207 — had no lane anywhere that could do anything
      # but SKIP BY NAME (round-4 blind critic, Fable). `issues: read` is
      # enough: milestones and issues of this repository are read through it,
      # and the references arm resolves public repositories in the same
      # organisation. The token is exported on the suite step below, and the
      # section's own probe (tools/gh_probe.sh) makes a skip on this lane RED.
      issues: read
    container:
      image: ${{ needs.dev-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # THE LANE THAT HOLDS ROADMAP HISTORY.
      #
      # BOUGHT 2026-09-21 (third critic, `/code-review 1226 medium`, finding
      # 5): ROADMAP.md's two pre-PR checkbox counts are DERIVED by
      # tools/docs_claims_check.sh from `git show <base>:ROADMAP.md` — and
      # every suite job's `actions/checkout` is shallow, so on a PR the merge
      # ref's parents are absent and the base is unreachable. Measured on this
      # PR's own head: linux/gcc job 106465168161 and macOS job 106465087620
      # BOTH printed `docs-claims: OK — NUMBERS 36 (history-deferred=2)`. Two
      # numbers presented as derived were derived on no lane at all, and
      # retyping 113 as 114 passed CI.
      #
      # One commit, one second. The SHA is read out of the tool rather than
      # copied here, so there is no second home for it to drift from; [99za]
      # holds its own literal and cross-checks the gate's derivation line.
      # A failure here is LOUD on purpose: a lane that silently cannot fetch
      # the base is a lane where these claims quietly stop being checked.
      - name: Fetch the ROADMAP-history base commit ([99za] derives from it)
        run: |
          set -eu
          sha=$(sed -n 's/^DC_ROADMAP_HIST_COMMIT="${DC_ROADMAP_HIST_COMMIT:-\(.*\)}"$/\1/p' \
                    tools/docs_claims_check.sh | head -1)
          if [ -z "$sha" ]; then
            echo "could not read DC_ROADMAP_HIST_COMMIT out of tools/docs_claims_check.sh"
            exit 1
          fi
          echo "ROADMAP-history base: $sha"
          if ! git -c safe.directory='*' cat-file -e "$sha:ROADMAP.md" 2>/dev/null; then
            git -c safe.directory='*' fetch --depth=1 origin "$sha"
            git -c safe.directory='*' cat-file -e "$sha:ROADMAP.md"
          fi
          echo "this lane HOLDS the base commit, so [99za] requires history-deferred=0 here"

      - name: Build
        run: CC=${{ matrix.cc }} ./build.sh

      - name: Verify binary
        run: ./src/eigenscript --version

      # THE full suite of the PR lane. gcc always runs all ~263 sections; the
      # only thing it no longer runs is [99i], which the `werror audit` job
      # owns for this run and which prints a SKIP naming that job.
      - name: Run test suite (full)
        if: matrix.cc == 'gcc' || github.event_name == 'push'
        env:
          EIGS_SKIP_WERROR_AUDIT: 1
          # [99zd]'s live arms. Without this the roadmap gate's milestone and
          # reference walks skip by name on every lane, which is exactly the
          # round-3 hole. With it, [99zd] REQUIRES `milestones=gh-api:…
          # refs=gh-api:… resolved=N skipped=0` and a `gh-api:` labels line.
          GH_TOKEN: ${{ github.token }}
        run: cd tests && bash run_all_tests.sh

      # clang on a PR: the value of this leg is the BUILD (-Werror fires at
      # compile time, and clang's codegen differs), not a tenth execution of
      # the same ~263 sections the gcc leg just ran on the same commit. It
      # runs the derived core-smoke plan instead. On a push to main it runs
      # the full suite like every other leg.
      - name: Run test suite (derived core-smoke plan)
        if: matrix.cc == 'clang' && github.event_name != 'push'
        env:
          EIGS_SUITE_SECTIONS: core
          EIGS_SKIP_WERROR_AUDIT: 1
          GH_TOKEN: ${{ github.token }}
        run: cd tests && bash run_all_tests.sh

      # Cross-repo observer corpus (#262): real observer-using programs
      # vendored from downstream consumers (dynamics solvers, iLambdaAi) plus
      # this repo's examples, each pinned to a value-path golden. The unit
      # suite proves the predicates in isolation; this guards that an observer
      # (or any) change doesn't silently shift real consumer behavior. Linux
      # only: the goldens are float-formatted on Linux.
      - name: Observer cross-repo corpus
        run: bash tests/observer_corpus/run.sh

      # Trace-on-fail (#394): prove a failing test's tape replays byte-for-byte,
      # then record one and archive it — the artifact a CI post-mortem replays
      # with `EIGS_REPLAY=<tape> eigenscript <file>` (same-binary; see TRACE.md).
      - name: Trace-on-fail replay + tape artifact
        if: matrix.cc == 'gcc'
        run: |
          bash tests/test_trace_on_fail.sh
          mkdir -p failure-tapes
          printf 'r is random of null\nprint of ("roll: " + (str of r))\nassert of [0, "demo red test — replay this tape"]\n' > /tmp/red_demo.eigs
          ./src/eigenscript --trace failure-tapes/red_demo.tape /tmp/red_demo.eigs || true

      - name: Upload trace-on-fail tape
        if: matrix.cc == 'gcc'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: trace-on-fail-tape
          path: failure-tapes/
          if-no-files-found: ignore

  # JIT differential oracle: the interpreter IS the JIT's oracle. Every corpus
  # program runs with the JIT off (recording a tape), then replays that tape
  # under the default JIT and under forced OSR; stdout+stderr+rc must be
  # byte-identical or listed in tests/jit_diff_expected.txt (a ledger of
  # filed divergences, never an amnesty). Measured 2026-09-02: nothing in the
  # suite or CI had ever diffed JIT-on against JIT-off; the JIT's own tests
  # were hand-written expectations. Its own job because the three-way run is
  # ~3x the suite's interpreter time.
  jit-differential:
    name: jit differential (interpreter oracle, tape-replayed)
    needs: [dev-image, scope]
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.dev-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build
        run: ./build.sh
      - name: JIT vs interpreter differential
        run: bash tools/jit_diff.sh

  # Tape replay fidelity (#1072): the tape's own contract is that a recording
  # replayed by the same binary reproduces stdout+stderr+rc, and jit_diff leans
  # on it to adjudicate nondeterministic programs. Every corpus program is
  # recorded and replayed with the JIT off on both sides; a divergence is either
  # the documented subprocess/concurrency boundary (counted, not a row) or a
  # fidelity hole ledgered in tests/replay_diff_expected.txt -- a ledger to work
  # down, never an amnesty. Measured 2026-09-02: 13 corpus programs did not
  # replay their own recording and nothing gated it.
  replay-differential:
    name: replay differential (same-binary tape fidelity)
    needs: [dev-image, scope]
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.dev-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build
        run: ./build.sh
      - name: Record-vs-replay differential
        run: bash tools/replay_diff.sh

  # Freestanding symbol gate: compiles the runtime with the freestanding
  # profile (-DEIGENSCRIPT_FREESTANDING=1) and asserts its undefined-symbol
  # set stays within tools/freestanding_allowlist.txt — the HAL roots +
  # mini-libc/libm surface from docs/FREESTANDING.md. Catches any new libc
  # dependency leaking into the EigenOS-bound profile. Also smoke-runs a
  # hosted build of the profile to prove the core language still executes.
  freestanding:
    name: freestanding profile (symbol gate + smoke)
    needs: [dev-image, scope]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.dev-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - if: needs.scope.outputs.code == 'true'
        name: Symbol gate (stage 1 profile, stage 2 mini-libc residue)
        run: make freestanding-check

      - if: needs.scope.outputs.code == 'true'
        name: Hosted smoke of the profile
        run: bash tools/freestanding_smoke.sh

      - if: needs.scope.outputs.code == 'true'
        name: Embedded-stack soak (64 KiB REPL soak + 256 KiB parse-depth-guard probe)
        run: bash tools/embed_stack_soak.sh

      - if: needs.scope.outputs.code == 'true'
        name: Mini-libc differential vs glibc oracle
        run: make freestanding-libc-diff

  # macOS exercises the BSD/clang toolchain and (on arm64) the non-x86 JIT
  # fallback. Runs natively — a Linux container image can't host these.
  build-and-test-macos:
    name: macos / ${{ matrix.os }}
    needs: scope
    runs-on: ${{ matrix.os }}
    # Intel completed the gfx gate and 540 compiler audit calls but reached
    # 30 minutes in the audit's fault controls (#1130). Keep the full suite.
    timeout-minutes: 45
    # macos-15-intel was the 35-minute job that SET the PR wall clock on
    # #1158. It is the slowest runner in the pool and it catches Intel-mac-only
    # shapes — worth having, and able to lag a day. On a push to `main` the
    # matrix is unchanged; on a pull request it is macos-latest only, and
    # macos-15-intel runs in .github/workflows/nightly.yml.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'push' && fromJSON('["macos-latest","macos-15-intel"]') || fromJSON('["macos-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - if: needs.scope.outputs.code == 'true'
        name: Shell harness portability controls
        shell: bash
        run: |
          result=$(mktemp)
          rc=0
          bash tests/test_ci_portability.sh > "$result" 2>&1 || rc=$?
          cat "$result"
          [ "$rc" -eq 0 ] || exit "$rc"
          [ "$(grep -cx 'ci-portability: checks=25 failures=0' "$result")" -eq 1 ]
          rc=0
          bash tests/test_ci_portability.sh --no-cleanup-deferral > "$result" 2>&1 || rc=$?
          cat "$result"
          [ "$rc" -eq 1 ]
          grep -qxF 'FAIL: cleanup deferral fault abandoned READY child after delivered signal and matching trap exit' "$result"
          ! grep -q '^ci-portability: checks=' "$result"

      # The YAML loader behind suite section [99zd] (arm (b) of
      # tools/workflow_yaml_check.sh). The Linux legs get it from the dev
      # image (.devcontainer/Dockerfile, python3-yaml); this runner has no
      # PyYAML, and without it two of that gate's planted faults cannot go
      # red. Best-effort: the gate SKIPs the arm BY NAME if this fails, and
      # the suite's caller allows that named skip only when PyYAML is
      # genuinely absent — never a silent pass.
      - if: needs.scope.outputs.code == 'true'
        name: Install PyYAML (the workflow-YAML gate's loader arm)
        run: |
          set -u
          python3 -m pip install --user --break-system-packages pyyaml \
            || python3 -m pip install --user pyyaml \
            || echo "PyYAML install failed; [99zd] arm (b) will SKIP BY NAME"
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)' \
            || echo "PyYAML is not importable on this runner"

      - if: needs.scope.outputs.code == 'true'
        name: Build
        run: CC=clang ./build.sh

      - if: needs.scope.outputs.code == 'true'
        name: Verify binary
        run: ./src/eigenscript --version

      # Use upstream LLVM's LSan runtime for the gfx gate, independently
      # of the default Apple Clang used for the interpreter build.
      # LLVM 20 deadlocks before main on macOS 26.4+ (llvm-project#182943).
      # The fix was backported to LLVM 22 (llvm-project#188913). The gate's
      # bounded executable control and intentional leak still verify it.
      - if: needs.scope.outputs.code == 'true'
        name: Select gfx LeakSanitizer toolchain
        run: |
          case '${{ matrix.os }}' in
            macos-15-intel) formula=llvm@18 ;;
            macos-latest)
              formula=llvm@22
              brew install --force-bottle "$formula"
              ;;
          esac
          if ! command -v timeout >/dev/null 2>&1 && ! command -v gtimeout >/dev/null 2>&1; then
            brew install --force-bottle coreutils
          fi
          sanitizer_cc="$(brew --prefix "$formula")/bin/clang"
          test -x "$sanitizer_cc"
          "$sanitizer_cc" --version
          echo "EIGS_ASAN_GFX_CC=$sanitizer_cc" >> "$GITHUB_ENV"

      - if: needs.scope.outputs.code == 'true'
        name: Verify gfx sanitizer controls
        run: bash tests/test_asan_gfx.sh --toolchain-only

      # PR lane: [99i] is owned by the `werror audit` job. Measured on the dev
      # box, that one section is the audit (6 min) plus its planted-fault
      # self-test (11 min) — the single largest block of this leg's 15 min.
      # Its verdict cannot differ by platform anyway: the only conditional in
      # the Makefile is LDFLAGS, a LINK flag, and the audit reads COMPILE
      # invocations. On a push to main it still runs here in full, so the
      # gate's BSD-userland portability keeps an exercise at merge time.
      - if: needs.scope.outputs.code == 'true' && github.event_name != 'push'
        name: Run test suite (PR lane; [99i] owned by the werror audit job)
        env:
          EIGS_SKIP_WERROR_AUDIT: 1
        run: cd tests && bash run_all_tests.sh

      - if: needs.scope.outputs.code == 'true' && github.event_name == 'push'
        name: Run test suite (main lane, [99i] included)
        run: cd tests && bash run_all_tests.sh

      # Linux LSP coverage lives in the extensions job; this leg exists
      # because the LSP build had macOS-only link failures nothing surfaced.
      - if: needs.scope.outputs.code == 'true'
        name: Compile-check LSP (macOS)
        run: make lsp CC=clang

  # Build the http+model variant and run the suite against it: the suite's
  # probe-gated sections ([44]-[45] HTTP, [47] model roundtrip/overflow,
  # transformer smoke) silently skip on the minimal build, so without this
  # job ~5000 lines of extension C never execute in CI. Also build the gfx
  # variant and run the suite against it (the audio-synthesis section [62] is
  # pure DSP — no display needed — and only executes against a gfx build; the
  # windowed gfx_* demos still auto-skip), exercise the embedding API
  # (eigs_embed.c is otherwise 0% — embed-smoke is the only thing that runs
  # it), compile-check the LSP (bitrots invisibly otherwise), and run the
  # standalone JIT emitter smoke tests.
  # Preserve the existing required check name while requiring every variant.
  # Each worker still checks out on docs-only changes; its code steps skip.
  # A failed/cancelled/skipped worker is never an aggregate success.
  extensions:
    name: extensions (http+model+gfx suite; embed/lsp/jit-smoke)
    needs: [scope, extensions-http, extensions-gfx, extensions-zlib, extensions-net]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require complete extension coverage
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CODE: ${{ needs.scope.outputs.code }}
          HTTP_RESULT: ${{ needs.extensions-http.result }}
          GFX_RESULT: ${{ needs.extensions-gfx.result }}
          ZLIB_RESULT: ${{ needs.extensions-zlib.result }}
          NET_RESULT: ${{ needs.extensions-net.result }}
        run: |
          set -euo pipefail
          [ "$SCOPE_RESULT" = success ]
          case "$CODE" in true|false) ;; *) exit 1;; esac
          for result in "$HTTP_RESULT" "$GFX_RESULT" "$ZLIB_RESULT" "$NET_RESULT"; do
            [ "$result" = success ] || exit 1
          done
          echo "Extension coverage complete (code=$CODE; four workers succeeded)"

  extensions-http:
    name: extensions / http+model and ancillary checks
    needs: [dev-image, scope]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.dev-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - if: needs.scope.outputs.code == 'true'
        name: Shell harness portability controls
        shell: bash
        run: |
          result=$(mktemp)
          rc=0
          bash tests/test_ci_portability.sh > "$result" 2>&1 || rc=$?
          cat "$result"
          [ "$rc" -eq 0 ] || exit "$rc"
          [ "$(grep -cx 'ci-portability: checks=25 failures=0' "$result")" -eq 1 ]
          rc=0
          bash tests/test_ci_portability.sh --no-cleanup-deferral > "$result" 2>&1 || rc=$?
          cat "$result"
          [ "$rc" -eq 1 ]
          grep -qxF 'FAIL: cleanup deferral fault abandoned READY child after delivered signal and matching trap exit' "$result"
          ! grep -q '^ci-portability: checks=' "$result"

      - if: needs.scope.outputs.code == 'true'
        name: JIT emitter smoke tests
        run: make jit-smoke

      - if: needs.scope.outputs.code == 'true'
        name: Embedding API smoke test (linked against the amalgamation)
        run: make embed-smoke

      - if: needs.scope.outputs.code == 'true'
        name: Embedding API smoke, gfx variant (one registration seam, #742)
        run: make embed-smoke-gfx

      # #885: embed-smoke covers multi-state SWITCHING on one thread. Nothing
      # covered two states running AT THE SAME TIME, which is the half
      # docs/EMBEDDING.md actually promises. Carries its own control row — a
      # shared file-scope global that MUST cross-talk — so a green result
      # cannot mean "the harness never raced".
      - if: needs.scope.outputs.code == 'true'
        name: Embedding API concurrent multi-state isolation (#885)
        run: make embed-concurrent

      - if: needs.scope.outputs.code == 'true'
        name: Static embed library (make lib)
        run: make lib

      - if: needs.scope.outputs.code == 'true'
        name: Two-file amalgamation drop-in (cc alone, fresh dir)
        run: bash tests/test_amalgamation.sh

      - if: needs.scope.outputs.code == 'true'
        name: Build http+model variant
        run: make http

      # PR lane: only the sections this binary UNLOCKS. The list is derived
      # by tools/section_plan.sh from the suite's own probe gates — the same
      # `http_route` / `eigen_model_loaded` probes the suite already uses to
      # decide whether to skip — plus a fixed core smoke, and the job fails if
      # the http binary unlocks fewer probe-gated chunks than its floor (a
      # broken registration otherwise collapses the plan silently).
      - if: needs.scope.outputs.code == 'true' && github.event_name != 'push'
        name: Run derived http+model section plan
        env:
          EIGS_SUITE_SECTIONS: http
          EIGS_SKIP_WERROR_AUDIT: 1
        run: cd tests && bash run_all_tests.sh

      - if: needs.scope.outputs.code == 'true' && github.event_name == 'push'
        name: Run full suite against http+model build
        env:
          EIGS_SKIP_WERROR_AUDIT: 1
        run: cd tests && bash run_all_tests.sh

      - if: needs.scope.outputs.code == 'true'
        name: Compile-check LSP
        run: make lsp

      - if: needs.scope.outputs.code == 'true'
        name: Compile-check DAP server
        run: make dap

      # 44 deterministic adversarial inputs against the ASan-instrumented
      # stdin harness (same compile->vm pipeline as main.c). Seconds to run;
      # any exit other than 0/1 is a crash.
      - if: needs.scope.outputs.code == 'true'
        name: Fuzz smoke (ASan harness, curated corpus)
        run: make fuzz && bash fuzz/run_fuzz.sh

  extensions-gfx:
    name: extensions / gfx suite
    needs: [dev-image, scope]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.dev-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - if: needs.scope.outputs.code == 'true'
        name: Build gfx variant
        run: make gfx

      - if: needs.scope.outputs.code == 'true' && github.event_name != 'push'
        name: Run derived gfx section plan (audio [62], [120b], [132], [133], [134])
        env:
          EIGS_SUITE_SECTIONS: gfx
          EIGS_SKIP_WERROR_AUDIT: 1
        run: cd tests && bash run_all_tests.sh

      - if: needs.scope.outputs.code == 'true' && github.event_name == 'push'
        name: Run full suite against gfx build (audio [62], containment [132], gfx examples [97])
        env:
          EIGS_SKIP_WERROR_AUDIT: 1
        run: cd tests && bash run_all_tests.sh


  extensions-zlib:
    name: extensions / zlib suite
    needs: [dev-image, scope]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.dev-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - if: needs.scope.outputs.code == 'true'
        name: Build zlib variant
        run: make zlib

      - if: needs.scope.outputs.code == 'true' && github.event_name != 'push'
        name: Run derived zlib section plan (executes DEFLATE section [124b])
        env:
          EIGS_SUITE_SECTIONS: zlib
          EIGS_SKIP_WERROR_AUDIT: 1
        run: cd tests && bash run_all_tests.sh

      - if: needs.scope.outputs.code == 'true' && github.event_name == 'push'
        name: Run full suite against zlib build (executes DEFLATE section [124])
        env:
          EIGS_SKIP_WERROR_AUDIT: 1
        run: cd tests && bash run_all_tests.sh


  extensions-net:
    name: extensions / net suite
    needs: [dev-image, scope]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.dev-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - if: needs.scope.outputs.code == 'true'
        name: Build net variant
        run: make net

      - if: needs.scope.outputs.code == 'true' && github.event_name != 'push'
        name: Run derived net section plan (executes network section [125])
        env:
          EIGS_SUITE_SECTIONS: net
          EIGS_SKIP_WERROR_AUDIT: 1
        run: cd tests && bash run_all_tests.sh

      - if: needs.scope.outputs.code == 'true' && github.event_name == 'push'
        name: Run full suite against net build (executes network section [125])
        env:
          EIGS_SKIP_WERROR_AUDIT: 1
        run: cd tests && bash run_all_tests.sh


  # Build the `full` variant (http+model+db) against a real PostgreSQL service
  # and run the suite with DATABASE_URL set. Without this, ext_db.c never
  # executes anywhere: the suite's DB section [46] is probe-gated on the build,
  # and test_db.eigs's live-path checks (DB09-DB15) additionally gate on an
  # actual connection. When the job is containerized the service is reachable
  # by its label (`db`), not localhost.
  database:
    name: db extension (postgres service)
    needs: [dev-image, scope]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.dev-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: eigs
          POSTGRES_PASSWORD: eigs_test
          POSTGRES_DB: eigs_test
        options: >-
          --health-cmd "pg_isready -U eigs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - if: needs.scope.outputs.code == 'true'
        name: Build full variant (http+model+db)
        run: make full

      - if: needs.scope.outputs.code == 'true' && github.event_name != 'push'
        name: Run derived full-variant section plan with live DATABASE_URL
        env:
          DATABASE_URL: postgres://eigs:eigs_test@db:5432/eigs_test
          EIGS_SUITE_SECTIONS: full
          EIGS_SKIP_WERROR_AUDIT: 1
        run: cd tests && bash run_all_tests.sh

      - if: needs.scope.outputs.code == 'true' && github.event_name == 'push'
        name: Run full suite with live DATABASE_URL
        env:
          DATABASE_URL: postgres://eigs:eigs_test@db:5432/eigs_test
          EIGS_SKIP_WERROR_AUDIT: 1
        run: cd tests && bash run_all_tests.sh

  # Run the entire suite under AddressSanitizer + UndefinedBehaviorSanitizer.
  # The net that catches use-after-free, buffer overflow, and UB the normal
  # -O2 build silently tolerates. Per-iteration leak regressions are covered
  # separately by tests/test_leak_guard.sh.
  # Keep the required status while both complete sanitizer variants run in
  # independent checkouts. Docs-only workers skip code steps but must succeed.
  sanitizers:
    name: asan + ubsan (full suite)
    needs: [scope, sanitizers-core, sanitizers-http]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Require complete sanitizer coverage
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CODE: ${{ needs.scope.outputs.code }}
          CORE_RESULT: ${{ needs.sanitizers-core.result }}
          HTTP_RESULT: ${{ needs.sanitizers-http.result }}
        run: |
          set -euo pipefail
          [ "$SCOPE_RESULT" = success ]
          case "$CODE" in true|false) ;; *) exit 1;; esac
          # A matrix job's aggregate result is success only when EVERY leg
          # succeeded, so this covers all ASAN_SHARDS shards plus the http worker.
          for result in "$CORE_RESULT" "$HTTP_RESULT"; do
            [ "$result" = success ] || exit 1
          done
          echo "Sanitizer job results OK (code=$CODE)"

      # "Every leg was green" is NOT "every section ran". The core work is
      # sharded, so this job re-derives the split and asserts the union is the
      # whole chunk list and the shards are disjoint — the same check the
      # shards themselves cannot make about each other.
      - if: needs.scope.outputs.code == 'true'
        name: Shard coverage — union == full suite, pairwise disjoint
        run: bash tools/section_plan.sh --shards ${{ env.ASAN_SHARDS }} --check

      - if: needs.scope.outputs.code == 'true'
        name: Download the shard receipts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1 (pairs with upload-artifact v7)
        with:
          pattern: asan-shard-*
          path: shard-receipts
          merge-multiple: true

      # Each shard leaves a receipt carrying its PLAN line and its LeakSanitizer
      # tally. Round 1 of this change learned the lesson the hard way: a count
      # nobody checks is decoration. Here the aggregate requires one receipt per
      # shard, a plan line in each, and a SUMMED leak tally of zero — the
      # per-shard tally is the CLAUDE.md gate ("a jump in the tally means a new
      # leak") and splitting the job must not split the gate.
      - if: needs.scope.outputs.code == 'true'
        name: Require one receipt per shard, and a summed leak tally of zero
        shell: bash
        run: |
          set -euo pipefail
          n="${{ env.ASAN_SHARDS }}"
          found=$(ls shard-receipts 2>/dev/null | grep -c . || true)
          echo "shard receipts: $found (expected $n)"
          [ "$found" = "$n" ] || { echo "::error::expected $n shard receipts, found $found"; exit 1; }
          total=0
          for k in $(seq 1 "$n"); do
            f="shard-receipts/shard-$k.txt"
            [ -f "$f" ] || { echo "::error::no receipt from shard $k"; exit 1; }
            cat "$f"
            # Two checks, not one, because they are different faults and the
            # combined message named the wrong one: a receipt carrying
            # `shard=2/2` (what a shard prints when EIGS_SUITE_SHARD lost its
            # /N) was rejected as "did not report its plan line", which sends
            # the reader looking for a missing line instead of a wrong N.
            plan=$(grep -o 'PLAN: shard=[0-9]*/[0-9]*' "$f" | head -1 || true)
            [ -n "$plan" ] || { echo "::error::shard $k reported no plan line at all"; exit 1; }
            [ "$plan" = "PLAN: shard=$k/$n" ] || { echo "::error::shard $k reported '$plan', expected 'PLAN: shard=$k/$n' — the shard ran a different split than this lane declares (ASAN_SHARDS=$n)"; exit 1; }
            leaked=$(sed -n 's/^leaked=\([0-9][0-9]*\)$/\1/p' "$f")
            [ -n "$leaked" ] || { echo "::error::shard $k did not report a leak tally"; exit 1; }
            total=$((total + leaked))
          done
          # Exactly one shard must have claimed each extra.
          for extra in gc_traversal lsp_asan; do
            # `grep -c` over MULTIPLE files prints one count per file, not a
            # total — the first version of this line compared "shard-1.txt:0"
            # against 1 and failed every run for the wrong reason.
            claims=$(cat shard-receipts/shard-*.txt | grep -c "^$extra=yes\$" || true)
            [ "$claims" = "1" ] || { echo "::error::$extra was claimed by $claims shard(s), expected exactly 1 — a derived owner nobody turned out to be means the check ran nowhere"; exit 1; }
            echo "$extra: claimed by exactly one shard"
          done
          echo "summed LeakSanitizer tally across $n shards: $total"
          [ "$total" -eq 0 ] || { echo "::error::leak tally is $total, expected 0 (CLAUDE.md: a jump in the tally means a new leak)"; exit 1; }
          echo "Sanitizer coverage complete (code=${{ needs.scope.outputs.code }}; $n shards + the http worker)"

  # THE PR LANE'S CRITICAL PATH, SHARDED (#1160 round 4).
  #
  # Measured on run 34962403732 (head 25ade7e): the whole 21.1-min wall was this
  # one job — 19.0 min, of which the suite step was 13.9 and the ASan build 4.7,
  # behind ~2 min of queue. It stays FULL by design: it is the leak-tally gate
  # (CLAUDE.md, "the suite must pass both release and ASan with leaks on"), so
  # the only way under 15 min is to run it in parallel.
  #
  # ARITHMETIC for N (queue 2.0 + build 4.7 + 13.9/N):
  #   N=1  20.6   N=2  13.7   N=3  11.3   N=4  10.2
  # N=2 clears 15 by 1.3 min, which is inside the run-to-run noise on shared
  # runners. N=3 clears it by 3.7. N=4 buys 1.1 min more for another 4.7
  # build-minutes, because past N=3 the BUILD dominates, not the suite. N=3.
  #
  # The split is by MEASURED weight (tests/section_weights.txt), deterministic,
  # and its union is pinned to the whole chunk list by the aggregator.
  #
  # WHY EACH SHARD BUILDS ITS OWN ASan BINARY (4.7 min x 3, in parallel) rather
  # than downloading one artifact: the suite asks the BUILD SYSTEM whether
  # src/eigenscript is current before it records the #681 fingerprint (#1089,
  # `ensure_binary_current` runs `make -q build/asan/eigenscript`). An artifact
  # download restores neither the objdir nor the mtimes make compares, so every
  # shard would answer "needs remaking" and rebuild anyway — paying the 4.7 min
  # PLUS the upload/download. The builds are parallel, so the wall cost is one
  # build either way; only machine-minutes differ, and correctness of the
  # staleness guard is worth more than 9 of them.
  sanitizers-core:
    name: asan + ubsan / core and LSP (shard ${{ matrix.shard }}/3)
    needs: [dev-image, scope]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # 45, not 30: the green run before #915's [99u] section landed took 19m57,
    # and that section legitimately adds minutes under ASan (it launches the
    # sanitized binary ~60 times; sanitizer process startup dominates) — a slow
    # runner then hit the old ceiling and the job rendered as CANCELLED at
    # 30:02 with the suite mid-section. A timeout is not a verdict: the same
    # tree's local ASan suite was 4117/4117. Headroom target ~2x the observed
    # green duration, per the suite-runtime-baseline rule.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.dev-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - if: needs.scope.outputs.code == 'true'
        name: Build with AddressSanitizer + UBSan
        run: make asan

      # THE OWNER OF EACH JOB-LEVEL EXTRA IS DERIVED, NOT HARD-WIRED (#1160
      # round 6). Round 4 pinned both of these to shard 1 — which is by
      # construction the HEAVIEST shard, so the extras always landed on the
      # critical path. Measured on run 35036548663: shard 1 was 14.1 min of a
      # 15.0 min lane, 4.5 of it the LSP step.
      #
      # The collector check is 5 s, so it goes to the LIGHTEST shard.
      - if: needs.scope.outputs.code == 'true'
        name: Collector traversal ownership and reach (lightest shard owns it)
        run: |
          set -euo pipefail
          owner=$(bash tools/section_plan.sh --shard-owner ${{ env.ASAN_SHARDS }} --quiet)
          echo "collector traversal check: shard $owner owns it (lightest by predicted weight)"
          if [ "$owner" != "${{ matrix.shard }}" ]; then
            echo "gc_traversal=no" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "gc_traversal=yes" >> "$GITHUB_ENV"
          python3 tools/gc_traversal_check.py --variant asan

      - if: needs.scope.outputs.code == 'true'
        name: Run shard ${{ matrix.shard }}/3 of the suite under sanitizers
        env:
          # Leak detection is ON: the suite runs leak-clean since the exit-time
          # teardown + birth-ref adoption fixes, so any new leak fails this job.
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          # [99i] is a Makefile/script property, not a sanitizer property, and
          # it is the most expensive thing this job did (it launches the
          # sanitized binary for every dry run). The `werror audit` job owns it.
          EIGS_SKIP_WERROR_AUDIT: 1
          EIGS_SUITE_SHARD: ${{ matrix.shard }}/3
        run: |
          set -o pipefail
          cd tests && bash run_all_tests.sh 2>&1 | tee "$GITHUB_WORKSPACE/shard.log"

      # The LSP behaviour test goes to whichever shard runs section [88], and
      # that is not a preference — it is the difference between 1.5 s and 267 s.
      # [88] builds eigenlsp under ASan through tests/aux_binary.sh, so the
      # shard that ran it has already paid for the build and this step is a
      # no-op rebuild. On run 35020270020 shard 1 happened to carry [88] and
      # this step took 1.5 s; when the CI-measured weights moved [88] to shard
      # 3, the same step on shard 1 cost 267 s building eigenlsp from scratch.
      - if: needs.scope.outputs.code == 'true'
        name: Behavior-test the LSP under sanitizers (the shard running [88] owns it)
        # `make asan` builds the interpreter, not eigenlsp — so the LSP would
        # otherwise never run under a sanitizer in CI. This builds it with
        # ASan/UBSan and drives the JSON-RPC harness; test_lsp.py fails on any
        # sanitizer report from the LSP process (leaks, UB).
        run: |
          set -euo pipefail
          owner=$(bash tools/section_plan.sh --shard-owner ${{ env.ASAN_SHARDS }} --section '[88]' --quiet)
          echo "LSP behaviour test: shard $owner owns it (it runs section [88], which already builds eigenlsp)"
          if [ "$owner" != "${{ matrix.shard }}" ]; then
            echo "lsp_asan=no" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "lsp_asan=yes" >> "$GITHUB_ENV"
          cd tests && bash test_lsp_asan.sh

      # The receipt the aggregator checks: the plan line this shard printed and
      # the LeakSanitizer tally it tolerated. Written even on failure, so a red
      # shard still reports what it measured.
      - if: always() && needs.scope.outputs.code == 'true'
        name: Write the shard receipt
        shell: bash
        run: |
          set -uo pipefail
          log="$GITHUB_WORKSPACE/shard.log"
          : > shard-${{ matrix.shard }}.txt
          grep -o 'PLAN: shard=[^"]*' "$log" | head -1 >> shard-${{ matrix.shard }}.txt || true
          leaked=$(sed -n 's/.*NOTE: \([0-9][0-9]*\) test program(s) exited nonzero on LeakSanitizer.*/\1/p' "$log" | head -1)
          echo "leaked=${leaked:-0}" >> shard-${{ matrix.shard }}.txt
          # Which job-level extras this shard claimed. The aggregator requires
          # exactly one claimant for each: a DERIVED owner that nobody turns out
          # to be is how "it runs somewhere" becomes "it runs nowhere".
          echo "gc_traversal=${gc_traversal:-no}" >> shard-${{ matrix.shard }}.txt
          echo "lsp_asan=${lsp_asan:-no}" >> shard-${{ matrix.shard }}.txt
          cat shard-${{ matrix.shard }}.txt

      - if: always() && needs.scope.outputs.code == 'true'
        name: Upload the shard receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: asan-shard-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.txt
          if-no-files-found: error

  sanitizers-http:
    name: asan + ubsan / HTTP and model suite
    needs: [dev-image, scope]
    runs-on: ubuntu-latest
    # 45, not 30: the green run before #915's [99u] section landed took 19m57,
    # and that section legitimately adds minutes under ASan (it launches the
    # sanitized binary ~60 times; sanitizer process startup dominates) — a slow
    # runner then hit the old ceiling and the job rendered as CANCELLED at
    # 30:02 with the suite mid-section. A timeout is not a verdict: the same
    # tree's local ASan suite was 4117/4117. Headroom target ~2x the observed
    # green duration, per the suite-runtime-baseline rule.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.dev-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The extension surface under sanitizers. `make asan` above compiles the
      # HTTP + model extensions OUT, so ext_http.c — a network-facing server
      # and client, the most exposed code in the repo — was never sanitized
      # anywhere. #239 (a remote DoS) reached main through a green CI for
      # exactly this reason. The suite's HTTP sections [44]/[45]/[45b] are
      # probe-gated on the binary exposing http_route, so building the http
      # variant is all it takes to pull them in.
      #
      # NOTE on what this does and does not catch: ASan's immediate checks
      # (use-after-free, buffer overflow, UB) report at the moment of the bug,
      # so they fire here. LeakSanitizer runs atexit — and test_http_server.sh
      # ends by `kill`ing the server, which installs no SIGTERM handler, so
      # LSan never runs in the server process. Per-request leaks in a request
      # path (#731) are therefore NOT caught by this step; that class needs an
      # RSS-growth gate, measured separately.
      #
      # This worker owns its checkout and alias, independently of core ASan.
      # PR lane: the sections the http+model surface unlocks, under the
      # sanitizers. This job was 26 min on #1158 — the second-longest on the
      # board — and the core sections it shared with `asan + ubsan / core and
      # LSP` are already sanitized there on the same commit.
      - if: needs.scope.outputs.code == 'true' && github.event_name != 'push'
        name: Run derived asan-http section plan under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          EIGS_SUITE_SECTIONS: asan-http
          EIGS_SKIP_WERROR_AUDIT: 1
        run: make asan-http && cd tests && bash run_all_tests.sh

      - if: needs.scope.outputs.code == 'true' && github.event_name == 'push'
        name: Run suite under sanitizers with the HTTP+model extensions
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          EIGS_SKIP_WERROR_AUDIT: 1
        run: make asan-http && cd tests && bash run_all_tests.sh

  # Valgrind/Memcheck over a representative spread of programs — the
  # uninitialised-read / use-after-free / definite+indirect-leak net at the
  # system-allocator granularity, complementing the ASan+UBSan job (and the
  # TSan-class race coverage). Runs on the plain uninstrumented binary, so no
  # instrumented libc is needed; JIT is forced off (its runtime-emitted native
  # code needs --smc-check=all and muddies the signal). A smoke set, not the
  # full suite, to fit the runtime budget under Valgrind's ~20-30x slowdown.
  # (Follow-up: annotate the arena/freelist allocators so it also sees uninit
  # reads *inside* the custom arena, not just at malloc granularity.)
  valgrind:
    name: valgrind (memcheck smoke, JIT off)
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - if: needs.scope.outputs.code == 'true'
        name: Install Valgrind
        # #987: this was a bare `apt-get update && apt-get install`. When the
        # mirror stalled it hung until the job's 30m cap killed it — and a
        # timed-out job's conclusion is `cancelled`, which `gh pr checks`
        # renders as **fail**. So an instrument that never ran presented
        # identically to a detected regression, on the one gate whose entire
        # purpose is to answer "did this change cost instructions?". Observed
        # twice in a row on PR #985 while all 17 other checks passed.
        #
        # Bounded retries plus a step-level cap mean a mirror hiccup costs
        # seconds, and an unreachable mirror fails as SETUP — loudly, and well
        # inside the job budget, so the measuring steps are never skipped
        # silently. Worst case here is ~9.5 min, not 30.
        timeout-minutes: 10
        run: |
          set -uo pipefail
          # Already present (some runner images ship it)? Nothing to do — and
          # nothing to hang on.
          if command -v valgrind >/dev/null 2>&1; then
            valgrind --version
            exit 0
          fi
          # The stall is in `apt-get update`, not in `install`: on 2026-08-19
          # it hung the full 60s cap on six job runs across three PRs while
          # `install` itself was fine, because the package index on the image
          # is usually fresh enough already. So TRY THE INSTALL FIRST and only
          # refresh the index if that actually fails — the common path no
          # longer touches the mirror that hangs.
          if timeout 120 sudo apt-get install -y valgrind; then
            valgrind --version || { echo "::error::valgrind installed but not runnable"; exit 1; }
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "::warning::valgrind not in the current index; refreshing (attempt $attempt)"
            if timeout 60 sudo apt-get update \
               && timeout 120 sudo apt-get install -y valgrind; then
              valgrind --version || { echo "::error::valgrind installed but not runnable"; exit 1; }
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::SETUP FAILURE — could not install valgrind after 3 bounded attempts. This is NOT a regression detected by the gate; the gate never ran."
          exit 1

      - if: needs.scope.outputs.code == 'true'
        name: Build (-O1 -g, minimal)
        run: make valgrind

      - if: needs.scope.outputs.code == 'true'
        name: Valgrind memcheck smoke
        run: cd tests && bash valgrind_smoke.sh

  # ThreadSanitizer concurrency race gate (#401): the spawn/channel slice must
  # be data-race-free (the #297 property, now regression-gated), and a seeded
  # race must be caught so the gate can't rot. `setarch -R` disables ASLR, which
  # ThreadSanitizer needs here (see CLAUDE.md).
  tsan:
    name: tsan (concurrency race gate)
    needs: scope
    runs-on: ubuntu-latest
    # Backstop for the per-run timeouts in test_tsan.sh: the seeded-race UB
    # hung ~1/3 of runs overnight (2026-07-05) and burned the 6h default.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - if: needs.scope.outputs.code == 'true'
        name: ThreadSanitizer build
        run: make tsan

      - if: needs.scope.outputs.code == 'true'
        name: Concurrency race gate (setarch -R)
        run: bash tests/test_tsan.sh

  # First-run tooling unification (#400): the VS Code tree is canonical and has
  # the LSP client, and a fresh install.sh leaves BOTH binaries on PATH.
  install-smoke:
    name: install.sh (interpreter + eigenlsp on PATH)
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - if: needs.scope.outputs.code == 'true'
        name: Canonical VS Code tree has the LSP client (no drifted duplicate)
        run: |
          test -f editors/vscode/extension.js
          test ! -e editor
          python3 - <<'PY'
          import json
          p = json.load(open("editors/vscode/package.json"))
          assert p.get("main") == "./extension.js", p.get("main")
          assert "vscode-languageclient" in p.get("dependencies", {}), "missing LSP client dep"
          assert "onLanguage:eigenscript" in p.get("activationEvents", []), "missing activation"
          print("editors/vscode/ package.json wires the LSP client")
          PY

      - if: needs.scope.outputs.code == 'true'
        name: Fresh install.sh puts eigenscript AND eigenlsp on PATH
        run: |
          ./install.sh
          test -x "$HOME/.local/bin/eigenscript"
          test -x "$HOME/.local/bin/eigenlsp"
          "$HOME/.local/bin/eigenscript" --version

      # #904: this job is the ONLY leg that creates the configuration a
      # contributor has after following the README — a build-tree binary
      # *and* an installed stdlib in ~/.local/lib/eigenscript (install.sh
      # writes both). It just never looked at it: `--version` imports
      # nothing. So a stdlib import that reported the stdlib as shadowing
      # itself, and resolved to the installed copy over the one shipped
      # next to the binary being run, was green here and 4-red on any
      # machine that had run install.sh. Both binaries are checked: the
      # installed one (single stdlib) and the tree one (two stdlibs — the
      # arrangement that actually forked resolution).
      - if: needs.scope.outputs.code == 'true'
        name: A stdlib import is clean with an installed stdlib present (#904)
        run: |
          # install.sh's second pass (`./build.sh lsp`) starts with `rm -f
          # eigenscript` inside src/, so the tree binary is gone by the time
          # install.sh returns — rebuild it. The two binaries differ only in
          # where they SIT, which is the whole point: `<exe>/../lib/` is a
          # resolution step, so the tree binary sees two stdlibs and the
          # installed one sees a single stdlib under `<exe>/../lib/eigenscript/`.
          ./build.sh
          test -x src/eigenscript
          printf 'import json\nprint of (json.json_from_pairs of ([["k", 1]]))\n' > /tmp/inst904.eigs
          for BIN in "$HOME/.local/bin/eigenscript" "$PWD/src/eigenscript"; do
            OUT=$(cd / && "$BIN" /tmp/inst904.eigs 2>&1)
            echo "$BIN -> $OUT"
            if ! echo "$OUT" | grep -q '{"k": 1}'; then
              echo "FAIL: stdlib did not resolve for $BIN"; exit 1
            fi
            if echo "$OUT" | grep -q "Warning: import"; then
              echo "FAIL: spurious shadowing warning from $BIN"; exit 1
            fi
          done
          echo "no import shadowed itself"

      # #905: run only the suite sections that exercise installed-layout
      # module resolution and bundles. This is deliberately a focused slice,
      # not a second full-suite leg; the installed binary is passed explicitly
      # so the assertions exercise ~/.local/lib/eigenscript as well as the
      # executable-relative stdlib.
      - if: needs.scope.outputs.code == 'true'
        name: Installed-layout module and bundle suite subset (#905)
        run: |
          export EIGENSCRIPT="$HOME/.local/bin/eigenscript"
          bash tests/run_install_smoke_subset.sh

  # Performance regression gate (#398). Wall-clock flakes on shared runners, so
  # the gate compares deterministic cachegrind instruction counts (Ir) of THIS
  # commit against origin/main — both built in the same runner, so the diff is a
  # pure code-change signal, never machine noise. A self-test proves a 2x-work
  # pessimization is caught. Published numbers (wall-clock) live in
  # docs/PERFORMANCE.md, regenerated from bench/run_bench.sh.
  bench:
    name: bench (instruction-count regression gate)
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - if: needs.scope.outputs.code == 'true'
        name: Install Valgrind
        # #987: this was a bare `apt-get update && apt-get install`. When the
        # mirror stalled it hung until the job's 30m cap killed it — and a
        # timed-out job's conclusion is `cancelled`, which `gh pr checks`
        # renders as **fail**. So an instrument that never ran presented
        # identically to a detected regression, on the one gate whose entire
        # purpose is to answer "did this change cost instructions?". Observed
        # twice in a row on PR #985 while all 17 other checks passed.
        #
        # Bounded retries plus a step-level cap mean a mirror hiccup costs
        # seconds, and an unreachable mirror fails as SETUP — loudly, and well
        # inside the job budget, so the measuring steps are never skipped
        # silently. Worst case here is ~9.5 min, not 30.
        timeout-minutes: 10
        run: |
          set -uo pipefail
          # Already present (some runner images ship it)? Nothing to do — and
          # nothing to hang on.
          if command -v valgrind >/dev/null 2>&1; then
            valgrind --version
            exit 0
          fi
          # The stall is in `apt-get update`, not in `install`: on 2026-08-19
          # it hung the full 60s cap on six job runs across three PRs while
          # `install` itself was fine, because the package index on the image
          # is usually fresh enough already. So TRY THE INSTALL FIRST and only
          # refresh the index if that actually fails — the common path no
          # longer touches the mirror that hangs.
          if timeout 120 sudo apt-get install -y valgrind; then
            valgrind --version || { echo "::error::valgrind installed but not runnable"; exit 1; }
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "::warning::valgrind not in the current index; refreshing (attempt $attempt)"
            if timeout 60 sudo apt-get update \
               && timeout 120 sudo apt-get install -y valgrind; then
              valgrind --version || { echo "::error::valgrind installed but not runnable"; exit 1; }
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::SETUP FAILURE — could not install valgrind after 3 bounded attempts. This is NOT a regression detected by the gate; the gate never ran."
          exit 1

      - if: needs.scope.outputs.code == 'true'
        name: Build this commit
        run: ./build.sh

      - if: needs.scope.outputs.code == 'true'
        name: Build origin/main in a worktree (same environment)
        run: |
          git fetch --no-tags --depth=1 origin main
          git worktree add /tmp/main-ref origin/main
          ( cd /tmp/main-ref && ./build.sh )

      - if: needs.scope.outputs.code == 'true'
        name: Gate self-test (a 2x pessimization must fail the gate)
        run: EIGENSCRIPT="$PWD/src/eigenscript" bash bench/check_regression.sh --selftest

      - if: needs.scope.outputs.code == 'true'
        name: Regression gate — Ir of this commit vs origin/main
        run: EIGENSCRIPT="$PWD/src/eigenscript" bash bench/check_regression.sh --vs /tmp/main-ref/src/eigenscript
