name: issue-triage

# Every open issue carries an `area:` label and a kind (docs/CI.md, "Issue
# labels"). This is repository housekeeping, so it runs here and never in the
# test suite: while it was a suite section, an unrelated unlabelled issue
# turned every pull request red and ejected queued merges (#1279, #1168).
#
#   * `triage` puts `needs-triage` on a new or reopened issue that has no
#     `area:` label, so the gap is visible on the issue itself.
#   * `audit` lists every open issue daily and fails while any one lacks an
#     `area:` label or a kind. GitHub's own issue list is the source; the job
#     reads it directly rather than through a gate script (#1275).

on:
  issues:
    types: [opened, reopened]
  schedule:
    # 05:23 UTC, off the hour and after the nightly lanes.
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-triage-${{ github.event_name }}-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  triage:
    name: issue-triage / label a new issue
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: "Mark an issue filed without an area: label"
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -u
          # Create the label only if it is missing, so a maintainer's edit to it survives.
          gh label list --repo "$GITHUB_REPOSITORY" --search needs-triage --json name \
              --jq '.[].name' | grep -qx needs-triage \
            || gh label create needs-triage --repo "$GITHUB_REPOSITORY" --color ededed \
                 --description "Filed without an area: label; triage and label it"
          labels=$(gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" \
                     --json labels --jq '.labels[].name')
          echo "issue #$ISSUE labels: ${labels:-<none>}"
          if printf '%s\n' "$labels" | grep -q '^area:'; then
            echo "issue #$ISSUE already carries an area: label; nothing to do"
            exit 0
          fi
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label needs-triage
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body \
            'Thanks for filing. Labelled `needs-triage` because it has no `area:` label yet. The scheme is `area:<subsystem>` (runtime-vm, jit, concurrency, observer, memory, trace-tape, packages, http, gfx, embed, docs, ci, gates, lint-tooling, consumer, aot, stdlib) plus a kind (`kind:*`, or the stock `bug`/`enhancement`) — add the ones that fit if you know them, and a maintainer will confirm and drop `needs-triage`. See CONTRIBUTING.md, "Reporting Bugs".'

  audit:
    name: issue-triage / every open issue is labelled
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: read
    steps:
      - name: "Every open issue carries an area: label and a kind"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 \
            --json number,labels > issues.json
          n=$(jq length issues.json)
          missing=$(jq -r '.[] | select([.labels[].name] as $l
                     | ($l | any(startswith("area:"))) and
                       ($l | any(startswith("kind:") or . == "bug" or . == "enhancement"))
                     | not) | "#\(.number)"' issues.json)
          echo "issue-labels: examined=$n missing=$(printf '%s' "$missing" | grep -c . || true)"
          # An empty list satisfies "nothing is missing" without checking anything.
          [ "$n" -gt 0 ] || { echo "no open issues were listed; the audit examined nothing"; exit 1; }
          [ -z "$missing" ] || { echo "unlabelled: $missing"; exit 1; }
