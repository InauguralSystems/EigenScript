# Publish docs/ as a GitHub Pages site (stable URLs for every document,
# per the AI-legibility playbook). configure-pages provisions the Pages
# site on first run (enablement: true), so no manual settings step is
# needed — but note GitHub Pages requires the repository to be public
# (or a paid plan for private repos).
#
# THE PLAYGROUND IS BUILT ON PULL REQUESTS, AND ITS VERDICT CAN BLOCK A MERGE
# (#1255). This workflow used to run on push-to-main only, so the real wasm32
# build (emcc, `web/build.sh`) was first attempted AFTER a merge — and it sat
# red on main for five commits (517cf08..0ac8a9b) while the local stand-in
# (tools/ilp32_syntax_check.sh, suite [99i3], clang -m32) was green: i386
# aligns `double` to 4 inside a struct and wasm32 aligns it to 8, so a layout
# `_Static_assert` can hold under the stand-in and fail the real target.
#
# Round 1 of #1255 added a path-filtered `pull_request` trigger. A
# path-filtered workflow cannot be a REQUIRED check — on a PR outside its
# paths it never reports, and a required check that never reports blocks the
# merge forever — so a red wasm build could still merge. So this workflow now
# has the same shape ci.yml uses for its required checks (docs/CI.md,
# "aggregators"): it runs on EVERY pull request, unfiltered, and
#
#   scope       decides whether the PR touches a playground input (the ONE
#               place the path list lives; ci.yml's `scope` is the pattern);
#   build       the worker: the SAME steps as always — one recipe,
#               `bash web/build.sh`, never a second copy of the emcc flags —
#               each guarded on scope, so an untouched PR finishes in seconds;
#               it leaves a RECEIPT (`built=true`) only after web/build.sh
#               exited 0 and produced web/dist/eigs.wasm;
#   playground  the aggregator, `if: always()`, with the stable check name
#               `playground (real emcc wasm32 build)`. It is success only when
#               scope succeeded with a known answer AND the worker succeeded
#               AND, if the inputs were touched, the receipt says the build ran.
#               A failed, cancelled or skipped worker is never success. THIS is
#               the check to require on main.
#
# Deploy is unchanged: Configure Pages, the artifact upload and the `deploy`
# job run only on push/dispatch, never on a pull request. Measured on main:
# the build job (emsdk setup cached + Jekyll + web/build.sh) is ~72 s. Main
# now builds on every push (no path filter there either, so the path list has
# one home); that costs ~72 s per push and keeps the published site current.
name: Docs site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deploys from main still serialize on ONE group, so a newer main push
# supersedes an older deploy. A pull request gets a group of its OWN ref:
# sharing `pages` would let every PR push cancel an in-flight main deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  scope:
    name: playground / scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      playground: ${{ steps.detect.outputs.playground }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - id: detect
        name: Detect whether the PR touches a playground or docs-site input
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "not a PR — build and (on main) deploy"
            echo "playground=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" "$HEAD")
          echo "changed files:"; printf '%s\n' "$files" | sed 's/^/  /'
          # THE path list: what web/build.sh compiles (src/, web/), what feeds
          # -DEIGENSCRIPT_VERSION (VERSION), what Jekyll renders (docs/), and
          # this workflow. Over-inclusion only costs a ~72 s build.
          if grep -qE '^(src/|web/|docs/|VERSION$|\.github/workflows/pages\.yml$)' <<<"$files"; then
            echo "-> playground input touched: the real emcc build runs"
            echo "playground=true" >> "$GITHUB_OUTPUT"
          else
            echo "-> no playground input touched: the worker reports green without building"
            echo "playground=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    # The worker. Its steps are guarded, not the job: a job-level skip would
    # read as `skipped`, which the aggregator treats as failure.
    name: playground / build (real emcc, web/build.sh) + docs site
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      built: ${{ steps.receipt.outputs.built }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Configure Pages
        if: needs.scope.outputs.playground == 'true' && github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
        with:
          enablement: true
      - name: Build with Jekyll
        if: needs.scope.outputs.playground == 'true'
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697  # v1.0.13
        with:
          source: ./docs
          destination: ./_site
      - name: Setup Emscripten
        if: needs.scope.outputs.playground == 'true'
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984  # v16
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache
      # The authoritative wasm32 check: the real emcc over the real recipe.
      # set -euo pipefail in web/build.sh makes a failed compile fail this step.
      - name: Build WASM playground
        if: needs.scope.outputs.playground == 'true'
        run: bash web/build.sh
      # The receipt. Written only when the build step above ran and left its
      # output; the aggregator requires it whenever scope said "touched", so a
      # build step skipped by a wrong guard cannot read as a passing build.
      - id: receipt
        name: Receipt — the real build ran
        if: needs.scope.outputs.playground == 'true'
        run: |
          set -euo pipefail
          test -s web/dist/eigs.wasm
          test -s web/dist/eigs.js
          echo "built=true" >> "$GITHUB_OUTPUT"
      - name: Stage playground under _site/playground
        if: needs.scope.outputs.playground == 'true'
        run: |
          sudo mkdir -p _site/playground
          sudo cp -v web/dist/* _site/playground/
          sudo chown -R "$(id -u):$(id -g)" _site/playground
      - name: Upload artifact
        if: needs.scope.outputs.playground == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0

  # The stable, requirable check. Same shape as ci.yml's `extensions` and
  # `asan + ubsan (full suite)` aggregators: `if: always()` so it reports even
  # when a need failed, and a failed/cancelled/skipped need is never success.
  playground:
    name: playground (real emcc wasm32 build)
    needs: [scope, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the real wasm32 build when its inputs changed
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          PLAYGROUND: ${{ needs.scope.outputs.playground }}
          BUILD_RESULT: ${{ needs.build.result }}
          BUILT: ${{ needs.build.outputs.built }}
        run: |
          set -euo pipefail
          echo "scope=$SCOPE_RESULT playground=$PLAYGROUND build=$BUILD_RESULT built=$BUILT"
          [ "$SCOPE_RESULT" = success ] || { echo "FAIL: scope did not succeed ($SCOPE_RESULT)"; exit 1; }
          case "$PLAYGROUND" in
            true|false) ;;
            *) echo "FAIL: scope gave no playground answer ('$PLAYGROUND')"; exit 1 ;;
          esac
          [ "$BUILD_RESULT" = success ] || { echo "FAIL: the playground build job did not succeed ($BUILD_RESULT)"; exit 1; }
          if [ "$PLAYGROUND" = true ] && [ "$BUILT" != true ]; then
            echo "FAIL: playground inputs changed but the build left no receipt — the real emcc build did not run"
            exit 1
          fi
          if [ "$PLAYGROUND" = true ]; then
            echo "OK: the real emcc build of web/build.sh passed"
          else
            echo "OK: no playground input changed; nothing to build"
          fi

  deploy:
    if: github.event_name != 'pull_request'
    needs: playground
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
