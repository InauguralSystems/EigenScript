name: Docker

# Publish container images of the EigenScript runtime to GitHub Container
# Registry. Two triggers:
#   - push to main → tag `:edge` (rolling pre-release)
#   - tag v*       → immutable `:X.Y.Z` plus eligible rolling release tags
#
# Multi-arch: linux/amd64 (JIT) and linux/arm64 (interpreter-only;
# src/jit.c is __x86_64__-gated). arm64 builds via QEMU emulation, so
# this job is slower than the amd64-only original.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required by docker/login-action -> ghcr.io push
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract immutable image metadata
        id: build-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/eigenscript
          tags: |
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.build-meta.outputs.tags }}
          labels: ${{ steps.build-meta.outputs.labels }}
          provenance: true
          sbom: true

      # Decide only after the slow multi-arch build. Each release rolling tag
      # advances independently: X.Y within its minor line, X within its major
      # line, and latest across all releases.
      - name: Check rolling tag eligibility
        id: rolling-tags
        env:
          SHA: ${{ github.sha }}
        run: |
          set -eu
          edge=false
          minor=false
          major=false
          latest=false
          case "$GITHUB_REF" in
            refs/heads/main)
              tip=$(git ls-remote origin refs/heads/main | awk 'NR == 1 { print $1 }')
              [ -n "$tip" ] || { echo "::error::could not read the main tip from origin"; exit 1; }
              if [ "$tip" = "$SHA" ]; then
                edge=true
                echo "main tip $SHA: edge enabled"
              else
                echo "main has moved to $tip: edge omitted"
              fi
              ;;
            refs/tags/v*)
              tag=${GITHUB_REF#refs/tags/}
              version=${tag#v}
              major_version=${version%%.*}
              remainder=${version#*.}
              minor_version=${remainder%%.*}
              releases=$(git ls-remote --tags --refs origin 'v*' \
                | sed 's|.*refs/tags/||')
              highest=$(printf '%s\n' "$releases" | sort -V | tail -1)
              [ -n "$highest" ] || { echo "::error::could not read release tags from origin"; exit 1; }
              highest_minor=$(printf '%s\n' "$releases" \
                | sed -n "/^v${major_version}\\.${minor_version}\\.[0-9][0-9]*$/p" \
                | sort -V | tail -1)
              highest_major=$(printf '%s\n' "$releases" \
                | sed -n "/^v${major_version}\\.[0-9][0-9]*\\.[0-9][0-9]*$/p" \
                | sort -V | tail -1)
              [ "$tag" = "$highest_minor" ] && minor=true
              [ "$tag" = "$highest_major" ] && major=true
              if [ "$tag" = "$highest" ]; then
                latest=true
              fi
              enabled=
              [ "$minor" = false ] || enabled="$enabled $major_version.$minor_version"
              [ "$major" = false ] || enabled="$enabled $major_version"
              [ "$latest" = false ] || enabled="$enabled latest"
              if [ -n "$enabled" ]; then
                echo "rolling tags enabled:${enabled}"
              else
                echo "newer releases exist: rolling tags omitted"
              fi
              ;;
          esac
          echo "edge=$edge" >> "$GITHUB_OUTPUT"
          echo "minor=$minor" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Extract rolling image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/eigenscript
          tags: |
            type=raw,value=edge,enable=${{ steps.rolling-tags.outputs.edge == 'true' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.rolling-tags.outputs.minor == 'true' }}
            type=semver,pattern={{major}},enable=${{ steps.rolling-tags.outputs.major == 'true' }}
            type=raw,value=latest,enable=${{ steps.rolling-tags.outputs.latest == 'true' }}

      - name: Promote rolling image tag
        if: steps.rolling-tags.outputs.edge == 'true' || steps.rolling-tags.outputs.minor == 'true' || steps.rolling-tags.outputs.major == 'true' || steps.rolling-tags.outputs.latest == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/eigenscript
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          # OCI references must be lowercase; repository_owner is
          # "InauguralSystems". metadata-action lowercases its own tags, but
          # this raw source reference is ours to normalize (#2278).
          IMAGE=$(printf '%s' "$IMAGE" | tr '[:upper:]' '[:lower:]')
          args=
          while IFS= read -r tag; do
            [ -n "$tag" ] && args="$args --tag $tag"
          done <<EOF
          $TAGS
          EOF
          # TAGS is generated by docker/metadata-action, so word splitting is
          # deliberate: each value becomes one buildx --tag argument.
          docker buildx imagetools create $args "$IMAGE@$DIGEST"

      - name: Smoke-test the image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.build-meta.outputs.tags }}
        run: |
          IMAGE="$(printf '%s\n' "$IMAGE_TAGS" | head -1)"
          echo 'print of "docker-ok"' > /tmp/hello.eigs
          for plat in linux/amd64 linux/arm64; do
            echo "=== Testing $IMAGE ($plat) ==="
            docker run --rm --platform "$plat" "$IMAGE" --version
            OUT=$(docker run --rm --platform "$plat" -v /tmp:/work -w /work "$IMAGE" hello.eigs)
            test "$OUT" = "docker-ok" || { echo "smoke test failed on $plat: $OUT"; exit 1; }
            echo "smoke test passed on $plat"
          done
