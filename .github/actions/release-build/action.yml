name: Build and test a release artifact
description: The single release and release-dry-run build/test recipe
inputs:
  label:
    description: Artifact platform label
    required: true
  runner:
    description: GitHub runner label (selects the pinned macOS LLVM)
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '3.12'
    - name: Install locked PyYAML (the workflow-YAML gate's loader arm)
      shell: bash
      run: |
        python3 -m venv .release-venv
        .release-venv/bin/python -m pip install --require-hashes --only-binary=:all: -r .github/requirements-release.txt
        echo "$PWD/.release-venv/bin" >> "$GITHUB_PATH"
        .release-venv/bin/python -c 'import yaml; print("PyYAML", yaml.__version__)'
    - name: Install GCC (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y gcc
    - name: Build minimal binary
      shell: bash
      run: |
        ./build.sh
        cp src/eigenscript eigenscript-${{ inputs.label }}
        chmod +x eigenscript-${{ inputs.label }}
    - name: Build full binary (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get install -y libpq-dev
        ./build.sh full
        mv src/eigenscript eigenscript-full-${{ inputs.label }}
        chmod +x eigenscript-full-${{ inputs.label }}
    - name: Install shared release test dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo bash tools/install_release_test_dependencies.sh linux
    - name: Install shared release test dependencies (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: bash tools/install_release_test_dependencies.sh macos '${{ inputs.runner }}'
    - name: Run tests against the release binary
      shell: bash
      env:
        TMPDIR: ${{ runner.temp }}
      run: |
        cp eigenscript-${{ inputs.label }} src/eigenscript
        cd tests && bash run_all_tests.sh
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: binaries-${{ inputs.label }}
        path: eigenscript-*${{ inputs.label }}
        if-no-files-found: error
